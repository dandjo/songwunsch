services:
  # The project's own reverse proxy -- only active with the "standalone" profile:
  #   docker compose --profile standalone up -d
  # If a Traefik is already running on the machine, this service stays off
  # and the running Traefik picks up the domain through the same labels.
  traefik:
    image: traefik:v3.7
    container_name: ${PROJECT_NAME}_traefik
    profiles: ['standalone']
    restart: unless-stopped
    ports:
      - '${TRAEFIK_HTTP_PORT}:80'
      - '${TRAEFIK_HTTPS_PORT}:443'
      - '127.0.0.1:${TRAEFIK_DASHBOARD_PORT}:8080'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./docker/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./docker/traefik/dynamic:/etc/traefik/dynamic:ro
      - ./docker/traefik/certs:/etc/traefik/certs:ro
    networks:
      - proxy

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: ${PROJECT_NAME}_web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: ${TZ}
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      AUTH_USER: ${AUTH_USER}
      AUTH_HASH: ${AUTH_HASH}
      # Sub-path of the application; Traefik strips it, the application puts
      # it back in links, redirects and the session cookie.
      BASE_PATH: ${BASE_PATH}
      SHOW_ERRORS: ${SHOW_ERRORS}
      # Traefik is the only way to the container, its X-Forwarded-For is
      # reliable -- the basis for the per-sender wish limit.
      TRUST_PROXY: '1'
    volumes:
      # Source code mounted live -- changes take effect without a rebuild.
      - .:/var/www/html
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=proxy'
      # The base path is removed before forwarding to Apache: the container
      # receives "/wishes", not "${BASE_PATH}/wishes". With the default
      # BASE_PATH=/ nothing is stripped. Want a sub-path? Set
      # BASE_PATH=/songliste in the .env.
      - 'traefik.http.middlewares.${PROJECT_NAME}_base.stripprefix.prefixes=${BASE_PATH}'
      - 'traefik.http.services.${PROJECT_NAME}_web.loadbalancer.server.port=80'
      - 'traefik.http.routers.${PROJECT_NAME}_web.service=${PROJECT_NAME}_web'
      - 'traefik.http.routers.${PROJECT_NAME}_web.entrypoints=web'
      - 'traefik.http.routers.${PROJECT_NAME}_web.rule=Host(`${DOMAIN_NAME}`) && PathPrefix(`${BASE_PATH}`)'
      - 'traefik.http.routers.${PROJECT_NAME}_web.middlewares=${PROJECT_NAME}_base@docker'
      - 'traefik.http.services.${PROJECT_NAME}_web_secure.loadbalancer.server.port=80'
      - 'traefik.http.routers.${PROJECT_NAME}_web_secure.service=${PROJECT_NAME}_web_secure'
      - 'traefik.http.routers.${PROJECT_NAME}_web_secure.entrypoints=websecure'
      - 'traefik.http.routers.${PROJECT_NAME}_web_secure.rule=Host(`${DOMAIN_NAME}`) && PathPrefix(`${BASE_PATH}`)'
      - 'traefik.http.routers.${PROJECT_NAME}_web_secure.middlewares=${PROJECT_NAME}_base@docker'
      - 'traefik.http.routers.${PROJECT_NAME}_web_secure.tls=true'
    networks:
      - default
      - proxy

  db:
    image: mysql:8
    container_name: ${PROJECT_NAME}_db
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      TZ: ${TZ}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      # Bound to localhost only -- for Adminer, DBeaver, PhpStorm.
      - '127.0.0.1:${DB_PORT_HOST}:3306'
    volumes:
      - db_data:/var/lib/mysql
      # Only on the very first start (empty data directory) and only as a
      # convenience for development: import the demo repertoire. The tables
      # themselves are created by the application (src/Schema.php); schema.sql
      # merely runs first here so demo.sql has something to insert into. The
      # numbers in the target names enforce the order.
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
      - ./sql/demo.sql:/docker-entrypoint-initdb.d/20-demo.sql:ro
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-u', 'root', '-p${DB_ROOT_PASSWORD}']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - default

volumes:
  db_data:

networks:
  proxy:
    name: proxy
    external: true
