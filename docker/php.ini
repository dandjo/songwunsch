; Songwunsch -- development defaults for the container.
expose_php = Off
display_errors = Off
log_errors = On
error_log = /dev/stderr
; Set through TZ from the .env; this is only the fallback.
date.timezone = Europe/Vienna

; Logos are scaled down on upload; a camera-sized original must fit through.
upload_max_filesize = 20M
post_max_size = 21M

session.cookie_httponly = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1

opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
